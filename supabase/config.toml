# Local Supabase (Supabase CLI) — `bun run dev:up`.
# Mirrors the shared wiibleyde.dev stack where it matters: Postgres 17, the
# `wildcard` schema exposed to PostgREST, a `portal` look-alike (created by the
# portal_stub migration) and seeded accounts (supabase/seed.sql).
project_id = "wildcard"

[api]
enabled = true
port = 54321
# Without `wildcard` here every query fails with PGRST106 (schema not exposed).
schemas = ["public", "graphql_public", "wildcard", "portal"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Sign-in happens on the portal in prod. Locally there is no portal: accounts are
# seeded with email/password and `bun run dev:login` mints the session cookie.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
