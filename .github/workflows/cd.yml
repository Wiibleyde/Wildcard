name: CD

# Build ONE config-free image and publish it to GHCR; optionally deploy it.
# The image embeds no public config — SUPABASE_URL / ANON_KEY / UMAMI_* are read
# at RUNTIME from the container env (see Dockerfile). So a single artifact runs
# in any environment: build once here, deploy by pulling, parameterise on start.

on:
  # Build only after CI is green on main — tests gate the published image.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Tagged releases (v1.2.3) get their own immutable, semver-tagged image.
  push:
    tags: ["v*"]
  # Manual trigger (Actions tab) — rebuild/redeploy on demand.
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never abort a deploy mid-flight

env:
  # GHCR requires a lowercase path; github.repository is "Wiibleyde/Wildcard"
  # (mixed case), so it's hardcoded here rather than derived.
  IMAGE: ghcr.io/wiibleyde/wildcard

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    # Skip when the gating CI run failed; tags / manual dispatch always build.
    # `branches: [main]` above matches the head branch NAME only — a fork PR
    # from a branch called "main" would also trigger it. So a workflow_run
    # build additionally requires a real push to THIS repository; anything else
    # (PRs, forks) must never publish :latest or reach the deploy job.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On workflow_run the default ref is the branch tip; check out the exact
          # commit CI validated instead, so the image matches the tested code.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=sha,format=long,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-push
    runs-on: ubuntu-latest
    # DORMANT until a server exists. Flip it on with a repo variable:
    #   Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED=true
    # Until then this job is skipped and CD just builds+publishes the image.
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN pulls the image on the server
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Same model as the other apps of the infra: the stack lives in
          # DEPLOY_PATH (~/infra/services/wildcard, compose from
          # deploy/compose.yml); pulling the new image and recreating the
          # container runs the migrations through the entrypoint.
          # Pipes the run's GITHUB_TOKEN to the host to pull from GHCR. Prefer a
          # long-lived PAT logged in once on the server? Drop the docker login
          # line and pre-authenticate the host instead.
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/Wiibleyde/Wildcard"
