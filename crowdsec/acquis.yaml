# Acquisition CrowdSec — d'où l'agent lit les logs à analyser.
#
# Cible les access logs JSON écrits par Caddy dans le volume partagé
# `caddy-logs`. Le label `type: caddy` route ces lignes vers le parser
# `crowdsecurity/caddy-logs` (installé via la collection `crowdsecurity/caddy`).
# Le parser EXIGE du JSON (format json dans le bloc log du Caddyfile).
filenames:
  - /var/log/caddy/*.log
labels:
  type: caddy
