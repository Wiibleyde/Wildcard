# ─────────────────────────────────────────────────────────────────────────────
# Wildcard — fragment de scrape Prometheus
#
# Job PROPRE À WILDCARD à ajouter aux `scrape_configs` du Prometheus du serveur
# (infra/monitoring/prometheus/prometheus.yml, cf. deploy/README.md). Cible
# l'endpoint applicatif /api/metrics (prom-client).
#
# Réseau : Prometheus et Wildcard partagent le réseau Docker `monitoring` ;
# le conteneur y est joignable par son nom `wildcard` — aucun port hôte publié.
#
# Auth : /api/metrics exige `Authorization: Bearer <METRICS_TOKEN>` (comparaison
# à temps constant) ; sans METRICS_TOKEN côté app, la route répond 404 (fermée
# par défaut). Le token DOIT être identique des deux côtés.
# Prometheus ne sait pas interpoler l'env → écrire le token dans un fichier
# (une ligne, sans retour final) monté en lecture seule dans le conteneur
# Prometheus à /etc/prometheus/wildcard-token (cf. deploy/README.md).
# ─────────────────────────────────────────────────────────────────────────────
- job_name: wildcard-app
  metrics_path: /api/metrics
  authorization:
    type: Bearer
    credentials_file: /etc/prometheus/wildcard-token
  static_configs:
    - targets:
        - wildcard:3000
      labels:
        project: wildcard
